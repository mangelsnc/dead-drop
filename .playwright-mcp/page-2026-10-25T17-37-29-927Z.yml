  - generic [ref=f11e4]:
    - paragraph [ref=f11e5]: 1 · DecodificarEl lector extrae el texto del QR. Si no hay QR legible, se descarta.
    - paragraph [ref=f11e6]: "2 · Prefijo¿Empieza por DD1.? Si no, es un QR ajeno: se ignora sin más."
    - paragraph [ref=f11e7]: 3 · Estructura¿Magic correcto, versión soportada, longitudes coherentes?
    - paragraph [ref=f11e8]: 4 · Sesión¿El file_id coincide con la sesión activa? Si no, es de otra transferencia.
    - paragraph [ref=f11e9]: 5 · Autenticación¿Poly1305 valida? Si no, la trama se descarta.
    - paragraph [ref=f11e10]: 6 · Al decodificadorSe despeja por propagación.
    - paragraph [ref=f11e11]: 7 · ¿Completo?Reconstruir y verificar el hash.
    - paragraph [ref=f11e12]: "Descartar nunca es un error.En este canal, perder tramas es lo normal: desenfoque, reflejo, movimiento de la mano. Una trama que falla cualquiera de los cinco filtros simplemente no se usa — no se avisa, no se aborta, no se reintenta.El código fuente digital es lo que convierte esa pérdida constante en un detalle sin importancia. Mientras lleguen suficientes tramas cualesquiera, el fichero se reconstruye."
