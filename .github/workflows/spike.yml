name: Spike Tests

on:
  push:
    branches: [main]
    paths:
      - 'spike/**'
  pull_request:
    branches: [main]
    paths:
      - 'spike/**'

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: spike
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        working-directory: spike
        run: python -m pytest tests/ -v
