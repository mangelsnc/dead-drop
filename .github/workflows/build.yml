name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  FLUTTER_VERSION: '3.24.5'

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Get packages
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Test
        working-directory: app
        run: flutter test

      - name: Build release
        working-directory: app
        run: flutter build linux --release

      - name: Package
        run: |
          cd app/build/linux/x64/release/bundle
          tar czf ../../../../../deaddrop-linux-x64.tar.gz .
          cd ../../../../../
          sha256sum deaddrop-linux-x64.tar.gz > deaddrop-linux-x64.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: deaddrop-linux-x64
          path: |
            deaddrop-linux-x64.tar.gz
            deaddrop-linux-x64.tar.gz.sha256

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get packages
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Test
        working-directory: app
        run: flutter test

      - name: Build release
        working-directory: app
        run: flutter build windows --release

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path app/build/windows/x64/runner/Release/* -DestinationPath deaddrop-windows-x64.zip
          $hash = (Get-FileHash deaddrop-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  deaddrop-windows-x64.zip" | Out-File -Encoding ascii deaddrop-windows-x64.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: deaddrop-windows-x64
          path: |
            deaddrop-windows-x64.zip
            deaddrop-windows-x64.zip.sha256

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Get packages
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Test
        working-directory: app
        run: flutter test

      - name: Build release
        working-directory: app
        run: flutter build macos --release

      - name: Package
        run: |
          cd app/build/macos/Build/Products/Release
          tar czf ../../../../../../deaddrop-macos-arm64.tar.gz dead_drop.app
          cd ../../../../../../
          shasum -a 256 deaddrop-macos-arm64.tar.gz > deaddrop-macos-arm64.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: deaddrop-macos-arm64
          path: |
            deaddrop-macos-arm64.tar.gz
            deaddrop-macos-arm64.tar.gz.sha256

  distribute-android:
    # Builds the Android APK and uploads it to Firebase App Distribution.
    #
    # Runs only on pushes to main (i.e. after a PR merges), never on pull
    # requests: PRs from forks cannot read repository secrets, so the upload
    # would fail for exactly the contributors least able to debug it. Gating
    # on the event keeps PR feedback fast and the testers' feed free of
    # builds that were never merged.
    #
    # The app bundles no Firebase SDK, so no google-services.json is needed
    # to build — App Distribution only needs the app id and a credential.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get packages
        working-directory: app
        run: flutter pub get

      # Decode the upload keystore from a base64 secret. Without it the
      # release build falls back to Gradle's debug keys, which rotate per
      # machine — testers would get an "app not installed" error on update
      # because the signature would not match their installed copy.
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. See docs/android-build.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "${RUNNER_TEMP}/upload-keystore.jks"

      - name: Write signing properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cat > app/android/key.properties <<EOF
          storeFile=${RUNNER_TEMP}/upload-keystore.jks
          storePassword=${STORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          EOF

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      # Uploaded with the Firebase CLI rather than a third-party action.
      # This step handles the service account key, which carries App
      # Distribution Admin rights; a marketplace action referenced by a
      # mutable tag could be repointed by its owner at any time and would
      # see that credential. The CLI is pinned to an exact version and comes
      # from Google, so the trusted set here is npm plus Firebase itself.
      #
      # Release notes are the merged commit subject plus the short SHA, so
      # testers can tell builds apart without opening GitHub.
      - name: Upload to Firebase App Distribution
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          npm install -g firebase-tools@13.29.1

          # Written to the runner temp dir, not the workspace, so it cannot
          # be picked up by a later step that archives the build tree.
          CREDS="${RUNNER_TEMP}/firebase-service-account.json"
          umask 077
          printf '%s' "$SERVICE_ACCOUNT_JSON" > "$CREDS"

          printf '%s\n\nCommit: %s\n' \
            "$(git log -1 --pretty=%s)" "$(git rev-parse --short HEAD)" \
            > "${RUNNER_TEMP}/release-notes.txt"

          GOOGLE_APPLICATION_CREDENTIALS="$CREDS" \
          firebase appdistribution:distribute \
            app/build/app/outputs/flutter-apk/app-release.apk \
            --app "$FIREBASE_APP_ID" \
            --groups testers \
            --release-notes-file "${RUNNER_TEMP}/release-notes.txt"

      - name: Clean up signing material
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/upload-keystore.jks" \
                "${RUNNER_TEMP}/firebase-service-account.json" \
                app/android/key.properties

  release:
    # Runs only on version tags (pushed by release.yml). Publishes the GitHub
    # Release with the changelog (stored in the annotated tag message) as the
    # body, plus the platform artifacts and SHA256SUMS.txt.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create SHA256SUMS
        run: |
          cd artifacts
          find . -name '*.sha256' -exec cat {} \; > ../SHA256SUMS.txt
          cd ..
          cat SHA256SUMS.txt

      - name: Extract changelog from tag
        run: |
          # release.yml stores the changelog in the annotated tag message.
          # Fall back to auto-generated notes if the tag has no annotation.
          TAG="${GITHUB_REF_NAME}"
          git fetch --tags --force
          git tag -l --format='%(contents)' "$TAG" > RELEASE_BODY.md
          if [ ! -s RELEASE_BODY.md ]; then
            echo "# DeadDrop $TAG" > RELEASE_BODY.md
          fi
          cat RELEASE_BODY.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_BODY.md
          files: |
            artifacts/deaddrop-linux-x64/deaddrop-linux-x64.tar.gz
            artifacts/deaddrop-linux-x64/deaddrop-linux-x64.tar.gz.sha256
            artifacts/deaddrop-windows-x64/deaddrop-windows-x64.zip
            artifacts/deaddrop-windows-x64/deaddrop-windows-x64.zip.sha256
            artifacts/deaddrop-macos-arm64/deaddrop-macos-arm64.tar.gz
            artifacts/deaddrop-macos-arm64/deaddrop-macos-arm64.tar.gz.sha256
            SHA256SUMS.txt
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
