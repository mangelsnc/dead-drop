name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  # release.yml calls this after it pushes a tag. A tag pushed by
  # GITHUB_TOKEN does not start a workflow of its own — GitHub suppresses
  # that to stop a workflow triggering itself forever — so without this
  # the tag would be created and nothing would ever build it.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to build and publish (e.g. v0.4.0)'
        required: true
        type: string

env:
  # Must match .fvmrc, which the Makefile and the Docker image tag read.
  # GitHub Actions cannot read a file into `env`, so this is the one place
  # the version is repeated — keep the two in step when bumping Flutter.
  FLUTTER_VERSION: '3.47.8'

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          # On a workflow_dispatch from release.yml this builds the tag
          # just pushed; on push/PR `inputs.tag` is empty and checkout
          # falls back to the triggering ref.
          ref: ${{ inputs.tag || github.ref }}

      # The Flutter version lives in two places — .fvmrc (read by the
      # Makefile and the Docker image tag) and FLUTTER_VERSION above,
      # because Actions cannot read a file into `env`. They have now
      # drifted twice, each time failing a whole CI run on something that
      # had nothing to do with the change. Fail here instead, in seconds,
      # with a message that says what to edit.
      - name: Flutter version matches .fvmrc
        run: |
          PINNED=$(sed -n 's/.*"flutter"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' .fvmrc)
          if [ "$PINNED" != "${{ env.FLUTTER_VERSION }}" ]; then
            echo "::error::.fvmrc pins Flutter $PINNED but this workflow's" \
                 "FLUTTER_VERSION is ${{ env.FLUTTER_VERSION }}." \
                 "Update env.FLUTTER_VERSION in .github/workflows/build.yml."
            exit 1
          fi
          echo "Both pin Flutter $PINNED"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          # GStreamer is camera_desktop's capture backend on Linux;
          # without it the CMake configure step fails before any
          # Dart is compiled. plugins-good carries the V4L2 element
          # that actually talks to a webcam.
          # libunwind-dev is named explicitly: libgstreamer1.0-dev depends
          # on it, and apt on this runner image will not pull it in by
          # itself — it reports "held broken packages" instead.
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev libunwind-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-good

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Get packages
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Test
        working-directory: app
        run: flutter test --exclude-tags timing

      # The wall-clock timing tests run only here. They prove the vault's
      # constant-cost unlock, which needs a quiet machine running native
      # code: this runner is native x86_64, while the project's Docker image
      # is emulated on an Apple Silicon developer machine, and the macOS
      # runner is shared and too noisy to measure on. Serial, so the
      # stopwatch does not share CPU with other suites.
      # See app/dart_test.yaml.
      - name: Test (wall-clock timing, serial)
        working-directory: app
        run: flutter test --tags timing --concurrency 1

      - name: Build release
        working-directory: app
        run: flutter build linux --release

      - name: Package
        run: |
          # Six levels up from bundle/ is the repo root, which is where
          # upload-artifact looks. Five lands in app/ and the artifact is
          # silently skipped with "No files were found".
          cd app/build/linux/x64/release/bundle
          tar czf "${GITHUB_WORKSPACE}/deaddrop-linux-x64.tar.gz" .
          cd "${GITHUB_WORKSPACE}"
          sha256sum deaddrop-linux-x64.tar.gz > deaddrop-linux-x64.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: deaddrop-linux-x64
          path: |
            deaddrop-linux-x64.tar.gz
            deaddrop-linux-x64.tar.gz.sha256

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          # On a workflow_dispatch from release.yml this builds the tag
          # just pushed; on push/PR `inputs.tag` is empty and checkout
          # falls back to the triggering ref.
          ref: ${{ inputs.tag || github.ref }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get packages
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Test
        working-directory: app
        run: flutter test --exclude-tags timing

      - name: Build release
        working-directory: app
        run: flutter build windows --release

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path app/build/windows/x64/runner/Release/* -DestinationPath deaddrop-windows-x64.zip
          $hash = (Get-FileHash deaddrop-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  deaddrop-windows-x64.zip" | Out-File -Encoding ascii deaddrop-windows-x64.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: deaddrop-windows-x64
          path: |
            deaddrop-windows-x64.zip
            deaddrop-windows-x64.zip.sha256

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          # On a workflow_dispatch from release.yml this builds the tag
          # just pushed; on push/PR `inputs.tag` is empty and checkout
          # falls back to the triggering ref.
          ref: ${{ inputs.tag || github.ref }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Get packages
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Test
        working-directory: app
        run: flutter test --exclude-tags timing

      - name: Build release
        working-directory: app
        run: flutter build macos --release

      - name: Package
        run: |
          cd app/build/macos/Build/Products/Release
          # The bundle is named by PRODUCT_NAME in Runner/Configs/AppInfo.xcconfig,
          # so hardcoding it here breaks silently whenever the app is renamed —
          # which is exactly what happened when it became DeadDrop. Find it.
          APP=$(ls -d *.app | head -1)
          test -n "$APP" || { echo "::error::no .app bundle in $(pwd)"; exit 1; }
          tar czf "${GITHUB_WORKSPACE}/deaddrop-macos-arm64.tar.gz" "$APP"
          cd "${GITHUB_WORKSPACE}"
          shasum -a 256 deaddrop-macos-arm64.tar.gz > deaddrop-macos-arm64.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: deaddrop-macos-arm64
          path: |
            deaddrop-macos-arm64.tar.gz
            deaddrop-macos-arm64.tar.gz.sha256

  build-ios:
    # Compile-only check. Distributing an .ipa needs an Apple signing
    # certificate, which requires the paid Developer Program and is not
    # available to GitHub-hosted runners — so this builds with --no-codesign.
    # It produces nothing installable; the point is to catch iOS-specific
    # breakage (plugin podspecs, Info.plist, Swift/ObjC glue) in CI rather
    # than on the one machine in the team that has Xcode.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          # On a workflow_dispatch from release.yml this builds the tag
          # just pushed; on push/PR `inputs.tag` is empty and checkout
          # falls back to the triggering ref.
          ref: ${{ inputs.tag || github.ref }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get packages
        working-directory: app
        run: flutter pub get

      - name: Build iOS (unsigned)
        working-directory: app
        run: flutter build ios --release --no-codesign

      # The camera permission string is the one iOS requirement that fails at
      # runtime rather than at build time: without it the scanner dies the
      # first time a user opens the receive screen, and the build stays green.
      - name: Check camera usage description is present
        run: |
          if ! /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" \
               app/ios/Runner/Info.plist >/dev/null 2>&1; then
            echo "::error file=app/ios/Runner/Info.plist::NSCameraUsageDescription is missing — the QR scanner will fail at runtime and App Store review rejects the build."
            exit 1
          fi
          echo "✔ NSCameraUsageDescription present"

  release:
    # Runs only on version tags (pushed by release.yml). Publishes the GitHub
    # Release with the changelog (stored in the annotated tag message) as the
    # body, plus the platform artifacts and SHA256SUMS.txt.
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      startsWith(inputs.tag, 'v')
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create SHA256SUMS
        run: |
          cd artifacts
          find . -name '*.sha256' -exec cat {} \; > ../SHA256SUMS.txt
          cd ..
          cat SHA256SUMS.txt

      - name: Resolve the tag being released
        id: tag
        run: |
          # On a dispatch the ref is a branch, so GITHUB_REF_NAME is wrong;
          # the tag comes in as an input instead.
          TAG="${{ inputs.tag }}"
          [ -n "$TAG" ] || TAG="${GITHUB_REF_NAME}"
          echo "name=$TAG" >> "$GITHUB_OUTPUT"

          # A tag with a suffix (v1.2.0-rc.1, v1.2.0-beta.2) is a
          # pre-release: it is published, but never offered as the latest
          # download. See docs/versioning.md.
          case "$TAG" in
            *-*) echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "Releasing $TAG"

      - name: Extract changelog from tag
        run: |
          # release.yml stores the changelog in the annotated tag message.
          # Fall back to auto-generated notes if the tag has no annotation.
          TAG="${{ steps.tag.outputs.name }}"
          git fetch --tags --force
          git tag -l --format='%(contents)' "$TAG" > RELEASE_BODY.md
          if [ ! -s RELEASE_BODY.md ]; then
            echo "# DeadDrop $TAG" > RELEASE_BODY.md
          fi
          cat RELEASE_BODY.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          body_path: RELEASE_BODY.md
          files: |
            artifacts/deaddrop-linux-x64/deaddrop-linux-x64.tar.gz
            artifacts/deaddrop-linux-x64/deaddrop-linux-x64.tar.gz.sha256
            artifacts/deaddrop-windows-x64/deaddrop-windows-x64.zip
            artifacts/deaddrop-windows-x64/deaddrop-windows-x64.zip.sha256
            artifacts/deaddrop-macos-arm64/deaddrop-macos-arm64.tar.gz
            artifacts/deaddrop-macos-arm64/deaddrop-macos-arm64.tar.gz.sha256
            SHA256SUMS.txt
          prerelease: ${{ steps.tag.outputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
