# Keeps the pinned action SHAs moving.
#
# The workflows pin every action to a commit SHA rather than a tag, so a
# tag the owner re-points cannot silently change what runs in CI — which
# matters here because the Android build holds the upload signing key.
#
# Pinning trades one risk for another: a frozen SHA never picks up a
# security fix either. Dependabot is the other half of that bargain, and
# without it the pins would quietly rot.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # One PR for all of them. Six actions updating separately would be
    # six PRs a week on a project with one maintainer.
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'ci'
