# DeadDrop development environment (optional convenience wrapper).
#
# The Makefile is the primary interface and works with plain `docker`.
# This compose file is for users who prefer `docker compose`:
#
#   docker compose build dev
#   docker compose run --rm dev bash
#
# The source tree is bind-mounted at /workspace (the container WORKDIR).
# The pub and Gradle caches are the same named volumes the Makefile uses, so
# packages downloaded by one are not downloaded again by the other.
#
# FLUTTER_VERSION must match .fvmrc, which is the single source of truth. The
# Makefile reads that file; compose cannot, so pass it in:
#
#   FLUTTER_VERSION=$(sed -n 's/.*"flutter"[^"]*"\([^"]*\)".*/\1/p' .fvmrc) \
#     docker compose build dev
#
# The default below is a fallback for a bare `docker compose build`; if it ever
# disagrees with .fvmrc, a test fails (app/test/toolchain_version_test.dart).

services:
  dev:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        # Match the container user to the host user so generated files
        # (build/, .dart_tool/, pubspec.lock) are owned by you, not root.
        USER_UID: ${UID:-1000}
        USER_GID: ${GID:-1000}
        FLUTTER_VERSION: ${FLUTTER_VERSION:-3.47.8}
    image: deaddrop-dev:${FLUTTER_VERSION:-3.47.8}
    container_name: deaddrop-dev
    working_dir: /workspace
    volumes:
      - .:/workspace
      - deaddrop-pub-cache:/opt/pub-cache
      - deaddrop-gradle-cache:/opt/gradle-cache
    environment:
      # Flutter web / hot-reload dev server (optional).
      - FLUTTER_WEB_PORT=5000
    ports:
      # Hot-reload / flutter run -d web-server
      - "5000:5000"
    stdin_open: true
    tty: true
    command: bash

volumes:
  # External: created by the Makefile (make _volumes) with the project label.
  # Shared with it on purpose, so both entry points reuse one download.
  deaddrop-pub-cache:
    external: true
  deaddrop-gradle-cache:
    external: true
