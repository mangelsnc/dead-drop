# Sized to fit the container, not the host. Docker Desktop commonly gets
# 4-8 GB, and the previous -Xmx4G plus -XX:MaxMetaspaceSize=2G asked for
# 6 GB of JVM alone, before the Gradle daemon's own overhead and the Dart
# compiler running alongside it. The kernel then killed the daemon, and
# the only symptom was "Gradle build daemon disappeared unexpectedly" —
# no out-of-memory message, nothing naming memory at all.
#
# 2 GB heap builds this project with room to spare. Metaspace is capped
# well below the heap because Gradle's own classes are what fill it, and
# 512 MB is far more than they need.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Disable Gradle file watcher in Docker (fixes "Couldn't poll for events" on macOS Docker)
org.gradle.vfs.watch=false
# The Flutter migrator added `android.builtInKotlin=false` and
# `android.newDsl=false` when this project was still on AGP 8.1. On AGP 9
# the new DSL is the only one read, so opting out of it fails the Flutter
# Gradle plugin outright. Both are gone with the AGP 9 upgrade.
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
