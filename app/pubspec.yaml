name: dead_drop
description: Air-gapped file transfer via animated QR codes. E2E encrypted, cross-platform, open source.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # QR rendering
  qr_flutter: ^4.1.0
  # Camera / QR scanning
  mobile_scanner: ^5.2.3
  # Crypto (libsodium bindings)
  sodium_libs: ^2.2.1+1
  # File picking
  file_picker: ^8.1.2
  # Path utilities
  path_provider: ^2.1.4
  # State management
  flutter_riverpod: ^2.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
