name: dead_drop
description: Air-gapped file transfer via animated QR codes. E2E encrypted, cross-platform, open source.
publish_to: 'none'
version: 0.9.2+164

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # QR rendering
  qr_flutter: ^4.1.0
  # Camera / QR scanning.
  #
  # mobile_scanner covers android, ios and macos. It has no Linux or Windows
  # implementation and the maintainers have not answered the request since
  # 2022, so the desktop builds get their scanner from two small pieces
  # instead: camera_desktop for V4L2/Media Foundation capture, and zxing2 to
  # decode the frames in pure Dart.
  #
  # flutter_zxing would do both in one package, but it pulls image_picker,
  # which pulls file_selector, which pulls `http` — a network client in the
  # dependency graph of an app whose whole claim is that it has no network
  # code. Measured on this project's own frames (704-char DD1 payload,
  # 640x480): zxing2 decodes in 5.3 ms median against an 83 ms budget at
  # 12 fps, so the pure-Dart path is not a compromise on speed.
  mobile_scanner: ^7.4.2
  camera_desktop: ^2.0.0
  # Declared explicitly because desktop_scanner.dart names CameraImageData
  # directly. It arrives via camera_desktop either way; relying on that
  # would break the day camera_desktop reorganises its own dependencies.
  camera_platform_interface: ^2.15.0
  zxing2: ^0.2.4
  # Crypto (libsodium bindings).
  #
  # sodium_libs was discontinued upstream and folded into `sodium` itself,
  # which now ships the platform binaries that used to need the separate
  # package. One dependency instead of two, and no longer a discontinued one
  # at the centre of a cryptography project.
  #
  # Argon2id (crypto_pwhash) is SUMO-ONLY, so the vault imports
  # package:sodium/sodium_sumo.dart directly (app/lib/src/vault/pwhash.dart).
  sodium: ^4.1.2
  # File picking
  file_picker: ^13.3.0
  # Path utilities
  path_provider: ^2.1.6
  # State management
  flutter_riverpod: ^2.5.1
  # Secure storage for identity keypair and TOFU store
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  # Used by the scanner tests to render real QR codes to decode. It arrives
  # transitively via qr_flutter, but tests name it directly.
  qr: ^3.0.2
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Lets tests swap in an in-memory FlutterSecureStoragePlatform instead of
  # hitting the real OS keychain over a platform channel that doesn't exist
  # in the flutter_tester VM.
  flutter_secure_storage_platform_interface: ^2.1.1

flutter:
  uses-material-design: true
